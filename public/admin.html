<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Clock Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin">
  <!-- Login -->
  <main id="login-view" class="login-card" hidden>
    <h1>Time Clock Admin</h1>
    <form id="login-form">
      <label>Password <input type="password" id="login-password" autocomplete="current-password" required autofocus></label>
      <button class="btn-primary" type="submit">Sign in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <strong id="app-title">Time Clock Admin</strong>
      <nav class="tabs" role="tablist">
        <button data-tab="report" class="active">Weekly report</button>
        <button data-tab="students">Students</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <button id="logout-all" class="btn-link" title="Sign out every computer and phone that is signed in to admin">Sign out everywhere</button>
      <button id="logout" class="btn-link">Sign out</button>
    </header>

    <div id="toast" class="toast" hidden></div>

    <!-- REPORT -->
    <section id="tab-report" class="tab">
      <div class="toolbar">
        <div class="week-nav">
          <button id="week-prev" class="btn-secondary" aria-label="Previous week">‹</button>
          <h2 id="week-label"></h2>
          <button id="week-next" class="btn-secondary" aria-label="Next week">›</button>
          <button id="week-today" class="btn-link">This week</button>
        </div>
        <div class="toolbar-actions">
          <button id="add-entry" class="btn-secondary">+ Add entry</button>
          <button id="export-csv" class="btn-secondary">Export CSV</button>
          <button id="print" class="btn-secondary">Print</button>
        </div>
      </div>

      <div id="on-clock" class="on-clock"></div>

      <div class="stats" id="stats"></div>

      <div class="table-wrap">
        <table class="report" id="report-table"></table>
      </div>
      <p class="muted small">Select a student's row to see, edit, or delete their entries. Hours are counted on the day the student clocked in.</p>
    </section>

    <!-- STUDENTS -->
    <section id="tab-students" class="tab" hidden>
      <div class="grid-2">
        <form id="add-student" class="panel">
          <h3>Add a student</h3>
          <label>Name <input name="name" required maxlength="80"></label>
          <label>PIN <input name="pin" inputmode="numeric" pattern="\d{4,8}" placeholder="Leave blank to auto-generate"></label>
          <button class="btn-primary" type="submit">Add student</button>
        </form>
        <form id="bulk-students" class="panel">
          <h3>Add many at once</h3>
          <label>One name per line <textarea name="names" rows="5" placeholder="Jane Doe&#10;John Smith"></textarea></label>
          <button class="btn-primary" type="submit">Add all (PINs auto-generated)</button>
        </form>
      </div>
      <div class="toolbar">
        <h2>Students <span id="student-count" class="muted"></span></h2>
        <button id="print-pins" class="btn-secondary" title="Prints a cut-out slip with the app address and PIN for each active student">Print PIN slips</button>
      </div>
      <div class="table-wrap">
        <table class="list" id="students-table"></table>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="tab-settings" class="tab" hidden>
      <form id="settings-form" class="panel narrow">
        <h3>General</h3>
        <label>App title <input name="title" maxlength="80"></label>
        <label>Time zone <input name="timezone" list="tz-list">
          <span class="muted small">Used to decide when a forgotten clock-out is from an earlier day.
            <button type="button" id="use-browser-tz" class="btn-link">Use this computer's time zone</button></span>
        </label>
        <datalist id="tz-list"></datalist>

        <button class="btn-primary" type="submit">Save settings</button>
      </form>
    </section>
  </div>

  <!-- Entry editor dialog -->
  <dialog id="entry-dialog">
    <form id="entry-form" method="dialog">
      <h3 id="entry-dialog-title">Edit entry</h3>
      <label>Student <select name="student_id" required></select></label>
      <label>Clock in <input type="datetime-local" name="clock_in" required></label>
      <label>Clock out <input type="datetime-local" name="clock_out">
        <span class="muted small">Leave blank if the student is still clocked in.</span></label>
      <label>Note <input name="note" maxlength="500" placeholder="Reason for change (optional)"></label>
      <p id="entry-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="entry-delete" class="btn-danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="entry-cancel" class="btn-secondary">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
